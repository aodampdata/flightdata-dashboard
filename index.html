html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif}
.w{max-width:1180px;margin:0 auto;padding:20px 16px 40px}

h2{font-size:15px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}

select,.imp{font:inherit;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .l{color:var(--mut);font-size:13px}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0}
.kpi .s{font-size:12px;color:var(--mut)}
.up{color:var(--up)}.dn{color:var(--dn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px;font-size:13px}
.box{position:relative;height:300px}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
.note{color:var(--mut);font-size:12px;line-height:1.7}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}

async function unzip(buf){const u=new Uint8Array(buf),dv=new DataView(buf),td=new TextDecoder();let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!=0x06054b50)e--;if(e<0)throw Error('不是有效的 xlsx 檔案');
const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const o={};
for(let i=0;i<n;i++){const me=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true),nm=td.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
if(!/^xl\/(workbook\.xml|_rels\/workbook\.xml\.rels|sharedStrings\.xml|worksheets\/sheet\d+\.xml)$/.test(nm))continue;
const lo=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),d=u.subarray(lo,lo+cs);
o[nm]=me==0?td.decode(d):await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}return o}

[...X(f['xl/_rels/workbook.xml.rels']).getElementsByTagName('Relationship')].forEach(r=>rel[r.getAttribute('Id')]=r.getAttribute('Target').replace(/^\/?(xl\/)?/,'xl/'));
[...X(f['xl/workbook.xml']).getElementsByTagName('sheet')].forEach(s=>{const d=f[rel[s.getAttribute('r:id')]];if(d)sh[s.getAttribute('name')]=d});return{ss,sh}}
function rowsOf(xml,ss){const R=[];for(const c of X(xml).getElementsByTagName('c')){const m=/^([A-Z]+)(\d+)$/.exec(c.getAttribute('r')),rn=+m[2];if(rn>61)continue;let ci=0;for(const ch of m[1])ci=ci*26+ch.charCodeAt(0)-64;ci--;if(ci>=26)continue;
const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val=null;if(t=='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else if(v){const x=v.textContent;val=t=='s'?ss[+x]:t=='str'?x:(t=='b'||t=='e')?null:+x}
(R[rn-1]=R[rn-1]||Array(26).fill(null))[ci]=val}return R.filter(Boolean)}
function parseSheet(rows){const out={};let yr=null,hd=null;for(const r of rows){const a=r[0];
if(typeof a=='number'&&Number.isInteger(a)&&a>=2000&&a<=2100){yr=a;hd=null;continue}
if(a=='Month'){hd={};r.forEach((v,i)=>{if(MX[v])hd[MX[v]]=i});continue}
if(yr&&hd&&typeof a=='string'&&MO.includes(a.toUpperCase())){const mi=MO.indexOf(a.toUpperCase());for(const k in hd){let v=r[hd[k]];if(typeof v!='number'||(ZN.has(k)&&v==0))v=null;if(v!=null&&(k=='OTP'||k=='OTP2'))v=Math.round(v*1e4)/1e4;((out[k]=out[k]||{})[yr]=out[k][yr]||Array(12).fill(null))[mi]=v}}}return out}
